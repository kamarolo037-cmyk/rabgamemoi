<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Рабство</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --text:#111; --muted:#8a8f98;
    --blue:#2f7bf6; --red:#ef4b4b; --border:#ececec;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#101114; --card:#1b1c20; --text:#f2f2f2; --muted:#8a8f98; --border:#2a2b30; }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%; touch-action: manipulation; -webkit-text-size-adjust: 100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    overscroll-behavior: none;
  }
  #app{max-width:520px;margin:0 auto;padding:16px 16px 90px;min-height:100%;}
  h1{font-size:22px;margin:4px 0 16px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;}
  .row{display:flex;align-items:center;gap:12px;}
  .avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#ccc;flex:none;}
  .avatar.sm{width:44px;height:44px;}
  .name{font-weight:700;font-size:18px;}
  .muted{color:var(--muted);font-size:14px;}
  .stat{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--border);font-size:15px;}
  .stat:first-of-type{border-top:none;}
  .banner{border-radius:14px;padding:16px;margin-bottom:14px;color:#fff;}
  .banner.owned{background:var(--red);}
  .banner.escape{background:var(--blue);}
  .banner button{margin-top:10px;width:100%;}
  button{
    border:none;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:600;
    background:var(--blue);color:#fff;cursor:pointer;
  }
  button.secondary{background:#eef0f3;color:var(--text);}
  button.danger{background:var(--red);}
  button:disabled{opacity:.5;}
  .price{color:var(--red);font-weight:700;}
  .list-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--border);}
  .list-item:first-child{border-top:none;}
  .list-item .info{flex:1;min-width:0;}
  .list-item .info .n{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  input[type=text]{
    width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);
    background:var(--card);color:var(--text);font-size:15px;margin-bottom:10px;
  }
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;display:flex;
    background:var(--card);border-top:1px solid var(--border);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .tab{flex:1;text-align:center;padding:10px 0 8px;font-size:12px;color:var(--muted);cursor:pointer;}
  .tab.active{color:var(--blue);}
  .tab .ico{font-size:20px;display:block;}
  .modal-bg{
    position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;
    z-index:50;
  }
  .modal{
    background:var(--card);width:100%;max-width:520px;margin:0 auto;border-radius:18px 18px 0 0;
    padding:20px;max-height:80vh;overflow:auto;
  }
  .toast{
    position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);
    background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;
    max-width:90%;text-align:center;
  }
  .empty{color:var(--muted);text-align:center;padding:30px 0;}
</style>
</head>
<body>
<div id="app"><div class="empty">Загрузка…</div></div>

<script>
// ======================= НАСТРОЙКИ =======================
const SUPABASE_URL = "https://gusoancxlsbixtnfzqpo.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_ef0R27oL_EFuBg97W1KdwA_j9EeIMDL";
// ===========================================================

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let me = null;          // текущий игрок (строка из players)
let tab = "profile";    // profile | market | top
let marketList = [];
let topList = [];
let detailPlayer = null; // объект для модалки (раб/цель покупки)

const fmt = n => Math.floor(n || 0).toLocaleString("ru-RU");

function toast(msg){
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2500);
}

async function init(){
  const u = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || null;
  const telegramId = u ? u.id : 000000; // fallback для теста вне Telegram
  const name = u ? [u.first_name, u.last_name].filter(Boolean).join(" ") : "Тестер";
  const avatar = u && u.photo_url ? u.photo_url : null;

  // Компания из ссылки: t.me/бот?start=название_компании  или  t.me/бот/app?startapp=название
  const startParam = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || "public";
  const companyId = (startParam || "public").toLowerCase().replace(/[^a-z0-9_\-]/g, "").slice(0, 32) || "public";

  const { data, error } = await sb.rpc("get_or_create_player", {
    p_telegram_id: telegramId,
    p_name: name,
    p_avatar_url: avatar,
    p_company_id: companyId
  });
  if (error) { render(`<div class="empty">Ошибка подключения: ${error.message}</div>`); return; }
  me = data;
  await collect();
  render();
  setInterval(collect, 8000);
}

async function collect(){
  if (!me) return;
  const { data, error } = await sb.rpc("collect_income", { p_player_id: me.id });
  if (!error) { me = data; render(); }
}

async function refreshMarket(){
  const { data } = await sb.rpc("list_market", { p_viewer_id: me.id, p_limit: 40 });
  marketList = data || [];
}
async function refreshTop(){
  const { data } = await sb.rpc("list_top", { p_viewer_id: me.id, p_limit: 40 });
  topList = data || [];
}
async function fetchOwnedSlaves(){
  const { data } = await sb.from("players").select("*").eq("owner_id", me.id).order("earn_rate", { ascending:false });
  return data || [];
}
async function fetchOwnerOf(id){
  if (!id) return null;
  const { data } = await sb.from("players").select("*").eq("id", id).single();
  return data;
}

// ======================= ДЕЙСТВИЯ =======================
async function buy(targetId){
  const { data, error } = await sb.rpc("buy_slave", { p_buyer_id: me.id, p_target_id: targetId });
  if (error) return toast(error.message.replace(/^.*ERROR:\s*/,""));
  toast("Куплен(а)!");
  await collect(); await refreshMarket(); closeModal(); render();
}
async function sell(slaveId){
  const { data, error } = await sb.rpc("sell_slave", { p_owner_id: me.id, p_slave_id: slaveId });
  if (error) return toast(error.message.replace(/^.*ERROR:\s*/,""));
  toast("Продан(а)!");
  await collect(); closeModal(); render();
}
async function applyShackles(slaveId){
  const { data, error } = await sb.rpc("apply_shackles", { p_owner_id: me.id, p_slave_id: slaveId });
  if (error) return toast(error.message.replace(/^.*ERROR:\s*/,""));
  toast("Оковы надеты на 5 часов!");
  await collect(); closeModal(); render();
}
async function freeSelf(){
  const { data, error } = await sb.rpc("free_self", { p_player_id: me.id });
  if (error) return toast(error.message.replace(/^.*ERROR:\s*/,""));
  me = data; toast("Вы свободны!"); render();
}
async function escape(){
  const { data, error } = await sb.rpc("try_escape", { p_player_id: me.id });
  if (error) return toast(error.message.replace(/^.*ERROR:\s*/,""));
  if (data.success) toast(`Побег удался! Украдено ${fmt(data.stolen)} ₽`);
  else toast("Побег не удался, попробуйте позже");
  await collect(); render();
}

// ======================= РЕНДЕР =======================
function render(html){
  const app = document.getElementById("app");
  if (html !== undefined) { app.innerHTML = html; return; }
  if (tab === "profile") renderProfile();
  else if (tab === "market") renderMarket();
  else renderTop();
}

async function renderProfile(){
  const slaves = await fetchOwnedSlaves();
  const totalRate = slaves.reduce((s,p)=>s+p.earn_rate,0);
  let bannerHtml = "";
  if (me.owner_id){
    const owner = await fetchOwnerOf(me.owner_id);
    const freePrice = 1000 + me.earn_rate * 11000;
    const canEscape = !me.locked_until || new Date(me.locked_until) < new Date();
    bannerHtml = `
      <div class="banner owned">
        Вы в рабстве у <b>${owner ? owner.name : "неизвестного"}</b> на работе «${me.job_title}»
        <button onclick="freeSelf()">Освободиться за ${fmt(freePrice)} ₽</button>
      </div>
      <div class="banner escape">
        ${canEscape ? "Попробуйте сбежать от хозяина и украсть немного деньжат." : `В оковах до ${new Date(me.locked_until).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})}`}
        <button class="secondary" ${canEscape?"":"disabled"} onclick="escape()">Сбежать от хозяина</button>
      </div>`;
  }

  const listHtml = slaves.length ? slaves.map(s => `
    <div class="list-item" onclick="openSlave('${s.id}')">
      <img class="avatar sm" src="${s.avatar_url || placeholderAvatar(s.name)}">
      <div class="info">
        <div class="n">${s.name}</div>
        <div class="muted">${s.job_title} · ${fmt(s.earn_rate)} ₽/мин</div>
      </div>
    </div>`).join("") : `<div class="empty">У вас пока нет рабов</div>`;

  render(`
    <h1>Мой профиль</h1>
    ${bannerHtml}
    <div class="card row">
      <img class="avatar" src="${me.avatar_url || placeholderAvatar(me.name)}">
      <div>
        <div class="name">${me.name}</div>
        <div class="muted">Работа: ${me.job_title}</div>
        <div class="muted">Компания: ${me.company_id || "public"}</div>
      </div>
    </div>
    <div class="card">
      <div class="stat"><span>Баланс</span><b>${fmt(me.balance)} ₽</b></div>
      <div class="stat"><span>Собственный доход</span><span>${me.owner_id ? "0" : fmt(me.earn_rate)} ₽/мин</span></div>
      <div class="stat"><span>Доход с рабов</span><span>${fmt(totalRate)} ₽/мин</span></div>
    </div>
    <div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:8px;">
        <b>Мои рабы (${slaves.length})</b><span class="muted">${fmt(totalRate)} ₽/мин</span>
      </div>
      ${listHtml}
    </div>
  `);
  window._slavesCache = slaves;
}

async function renderMarket(){
  await refreshMarket();
  const html = marketList.length ? marketList.map(p => {
    const price = 200 + p.earn_rate * 1500;
    return `
    <div class="list-item" onclick="openTarget('${p.id}')">
      <img class="avatar sm" src="${p.avatar_url || placeholderAvatar(p.name)}">
      <div class="info">
        <div class="n">${p.name}</div>
        <div class="muted">${p.owner_id ? "в рабстве" : "свободен"} · ${fmt(p.earn_rate)} ₽/мин</div>
      </div>
      <div class="price">${fmt(price)} ₽</div>
    </div>`;
  }).join("") : `<div class="empty">Пока некого купить</div>`;
  render(`<h1>Покупка рабов</h1><div class="card">${html}</div>`);
}

async function renderTop(){
  await refreshTop();
  const html = topList.map((p,i) => `
    <div class="list-item">
      <b style="width:20px;">${i+1}</b>
      <img class="avatar sm" src="${p.avatar_url || placeholderAvatar(p.name)}">
      <div class="info">
        <div class="n">${p.name}${p.id===me.id?" (вы)":""}</div>
        <div class="muted">${fmt(p.earn_rate)} ₽/мин</div>
      </div>
      <b>${fmt(p.balance)} ₽</b>
    </div>`).join("");
  render(`<h1>Рейтинг</h1><div class="card">${html}</div>`);
}

function placeholderAvatar(name){
  const letter = encodeURIComponent((name||"?")[0].toUpperCase());
  return `https://api.dicebear.com/7.x/initials/svg?seed=${letter}`;
}

// ======================= МОДАЛКИ =======================
function openSlave(id){
  const s = (window._slavesCache||[]).find(x=>x.id===id);
  if (!s) return;
  const locked = s.locked_until && new Date(s.locked_until) > new Date();
  const sellPrice = 100 + s.earn_rate * 17;
  const shacklesPrice = 500 + Math.floor(s.earn_rate * 20);
  showModal(`
    <div class="row" style="margin-bottom:12px;">
      <img class="avatar" src="${s.avatar_url || placeholderAvatar(s.name)}">
      <div><div class="name">${s.name}</div><div class="muted">${s.job_title} · ${fmt(s.earn_rate)} ₽/мин</div></div>
    </div>
    ${locked
      ? `<div class="muted" style="margin-bottom:12px;">В оковах ещё до ${new Date(s.locked_until).toLocaleString("ru-RU")}</div>`
      : `<div class="muted" style="margin-bottom:12px;">Сейчас свободен от оков</div>`
    }
    <button onclick="sell('${s.id}')" ${locked ? "disabled class='secondary'" : ""} style="margin-bottom:10px;width:100%;">
      Продать за ${fmt(sellPrice)} ₽
    </button>
    <button onclick="applyShackles('${s.id}')" style="width:100%;background:#555;">
      Надеть оковы на 5 часов за ${fmt(shacklesPrice)} ₽
    </button>
  `);
}

function openTarget(id){
  const p = marketList.find(x=>x.id===id);
  if (!p) return;
  const price = 200 + p.earn_rate * 1500;
  showModal(`
    <div class="row" style="margin-bottom:12px;">
      <img class="avatar" src="${p.avatar_url || placeholderAvatar(p.name)}">
      <div><div class="name">${p.name}</div><div class="muted">${p.job_title} · ${fmt(p.earn_rate)} ₽/мин</div></div>
    </div>
    <button onclick="buy('${p.id}')">Купить за ${fmt(price)} ₽</button>
  `);
}

function showModal(inner){
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.id = "modalBg";
  bg.onclick = (e)=>{ if(e.target.id==="modalBg") closeModal(); };
  bg.innerHTML = `<div class="modal">${inner}</div>`;
  document.body.appendChild(bg);
}
function closeModal(){
  const bg = document.getElementById("modalBg");
  if (bg) bg.remove();
}

// ======================= ТАББАР =======================
function switchTab(t){ tab = t; render(); }

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("app").insertAdjacentHTML("afterend", `
    <div class="tabbar">
      <div class="tab" id="t-profile" onclick="switchTab('profile')"><span class="ico">👤</span>Мой профиль</div>
      <div class="tab" id="t-market" onclick="switchTab('market')"><span class="ico">🛒</span>Покупка</div>
      <div class="tab" id="t-top" onclick="switchTab('top')"><span class="ico">⭐</span>Рейтинг</div>
    </div>
  `);
  init();
});

const _origSwitchTab = switchTab;
switchTab = function(t){
  _origSwitchTab(t);
  document.querySelectorAll(".tab").forEach(el=>el.classList.remove("active"));
  const el = document.getElementById("t-"+t);
  if (el) el.classList.add("active");
};
</script>
</body>
</html>
